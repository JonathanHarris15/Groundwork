<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Groundwork</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560;9..144,640&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/site.css?v=3" />
</head>
<body>
  <div id="groundwork">
    <header class="top">
      <a class="wordmark" href="/" data-nav>Groundwork</a>
      <nav>
        <a href="/" data-nav>Home</a>
        <a href="/profile" data-nav>Your map</a>
        <a href="/#install" data-nav>Install</a>
        <a id="auth-link" href="/signin" data-nav>Sign in</a>
      </nav>
    </header>
    <main id="view"></main>
  </div>
  <template id="home-template">
    <section class="hero">
      <p class="eyebrow">A tutor that remembers</p>
      <h1>Your concepts, mapped.</h1>
      <p class="lede">Groundwork lives in Obsidian, and the tutor’s memory lives on your account. This site reads that account and draws the concept map on your profile — the same links the tutor is building, updated as you study.</p>
      <div class="hero-actions">
        <a class="btn" href="https://community.obsidian.md/plugins/groundwork">Add Groundwork to Obsidian</a>
        <a class="btn btn-quiet" href="/join" data-nav>Create an account</a>
      </div>
    </section>
    <section class="panel" id="install">
      <h2>Install from the community page</h2>
      <p>The plugin is listed on the Obsidian community page. The button above opens that page. Obsidian installs <code>manifest.json</code>, <code>main.js</code>, and <code>styles.css</code> from it.</p>
      <ol>
        <li>Open the <a href="https://community.obsidian.md/plugins/groundwork">Groundwork community page</a>.</li>
        <li>In Obsidian, open <strong>Settings → Community plugins</strong> and turn community plugins on.</li>
        <li>Install Groundwork, enable it, and trust the vault.</li>
        <li>In Groundwork’s settings, sign in. The tutor’s memory is saved on this account, and the profile map follows it.</li>
      </ol>
    </section>
    <section class="panel">
      <h2>What the profile shows</h2>
      <p>The map shows concept titles, which idea rests on which, and how solid each one is. The notes, quiz text, and learner profile behind it stay on the account. In the vault, the tutor only opens folders you choose as extra context.</p>
    </section>
  </template>
  <script src="/app.js?v=3"></script>
</body>
</html>
